<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<meta name="robots" content="noindex">
<title>Aletheia – Banca dati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Terminale interno di un'agenzia investigativa: testata scura, schede come fogli d'archivio, dati in monospazio. */
:root{
  --ink:#14202b; --ink2:#22313f; --paper:#f4f5f6; --sheet:#ffffff; --rule:#d9dde1; --text:#1c2329; --muted:#66717c; --stamp:#a8261d; --hit:#2f6f4f;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--f-ui);font-size:16px;-webkit-text-size-adjust:100%}
.top{background:var(--ink);color:#e8edf1;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand b{font-weight:600;letter-spacing:.32em;font-size:15px}
.brand span{font-family:var(--f-data);font-size:10.5px;color:#93a3b1;letter-spacing:.06em;text-transform:uppercase}
.sub{font-size:13px;color:#a9b6c1;margin-top:4px;letter-spacing:.02em}
form{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;font-family:var(--f-data);font-size:16px;padding:12px;border:1px solid #3a4b5b;background:#0d161e;color:#fff;border-radius:2px}
input::placeholder{color:#6f8090}
input:focus{outline:2px solid #6aa6d6;outline-offset:0}
button{font:inherit;cursor:pointer}
.go{flex:none;background:#e8edf1;color:var(--ink);border:0;padding:0 18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;border-radius:2px}
.go:active{background:#c9d3db}
.go:disabled{opacity:.6}
.hint{font-size:12.5px;color:#93a3b1;margin-top:10px;line-height:1.45}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.status{font-family:var(--f-data);font-size:12.5px;color:var(--muted);min-height:18px;margin-bottom:12px}
.miss{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--stamp);padding:14px 16px;font-size:15px;line-height:1.45}
.miss b{font-family:var(--f-data);font-weight:500;word-break:break-word}
.miss p{margin:6px 0 0;color:var(--muted);font-size:13.5px}
/* scheda */
.card{background:var(--sheet);border:1px solid var(--rule);box-shadow:0 1px 0 rgba(0,0,0,.04);position:relative;overflow:hidden}
.head{padding:14px 16px 12px;border-bottom:2px solid var(--ink)}
.kind{font-family:var(--f-data);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.head h1{margin:4px 0 8px;font-size:24px;font-weight:600;line-height:1.15;text-wrap:balance;padding-right:78px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.stamp{position:absolute;top:16px;right:12px;border:2px solid var(--stamp);color:var(--stamp);font-weight:600;font-size:11px;letter-spacing:.14em;padding:3px 6px;transform:rotate(6deg);opacity:.85}
.photo{display:block;width:100%;max-height:340px;object-fit:contain;background:#e9ecef;border-bottom:1px solid var(--rule)}
.sec{padding:12px 16px 4px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec h2{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-weight:600}
dl{margin:0}
.f{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 12px;padding:6px 0;border-top:1px dashed #e6e9ec}
.f:first-child{border-top:0}
dt{font-size:13px;color:var(--muted)}
dd{margin:0;font-family:var(--f-data);font-size:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.para{font-family:var(--f-data);font-size:14px;line-height:1.5;white-space:pre-wrap;margin:0 0 8px}
ul.lst{margin:0 0 8px;padding:0;list-style:none}
ul.lst li{font-family:var(--f-data);font-size:14px;line-height:1.45;padding:6px 0;border-top:1px dashed #e6e9ec;white-space:pre-wrap}
ul.lst li:first-child{border-top:0}
.none{color:#9aa3ab}
@media (max-width:420px){.f{grid-template-columns:1fr;gap:1px}dt{font-size:12px}}
/* storico */
.hist{margin-top:22px}
.hist h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.hist button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:10px 2px;font-family:var(--f-data);font-size:13.5px;color:var(--text)}
.hist button span:last-child{flex:none;font-size:11px;letter-spacing:.06em}
.ok{color:var(--hit)}.ko{color:var(--stamp)}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:8px 0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>ALETHEIA</b><span>Accesso riservato</span></div>
    <div class="sub">Banca dati investigativa</div>
    <form id="f" autocomplete="off">
      <input id="q" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Dato da ricercare" aria-label="Dato da ricercare">
      <button class="go" id="go" type="submit">Cerca</button>
    </form>
    <div class="hint">Inserire il dato completo ed esatto: nome e cognome, numero di telefono, targa, indirizzo, ragione sociale, codice di prenotazione.</div>
  </div>
</header>
<main class="wrap">
  <div class="status" id="st" aria-live="polite"></div>
  <div id="out"></div>
  <section class="hist" id="hist"></section>
</main>

const SALE="a8700f190a64f66fc7fbaf46c489f606";

// Deve restare identica a norm() in build.mjs
function norm(s){
  s=String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  if(/^[\s+().\-/\d]+$/.test(s)){
    let d=s.replace(/\D/g,"");
    d=d.replace(/^(0039|39)(?=3\d{8,9}$)/,"");
    if(d.length>=6) return "n:"+d;
  }
  return s.replace(/[^a-z0-9]/g,"");
}
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function lookup(q){
  const nk=norm(q); if(!nk) return null;
  const id=hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALE+":"+nk))).slice(0,32);
  const p=INDICE[id]; if(!p) return null;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(nk),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(p.s),iterations:60000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(p.i)},key,ub(p.c))));
  }catch(e){return null}
}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function val(v){return v==null||v===""?`<span class="none">nessun dato</span>`:esc(v)}
function section(title,body){
  let inner;
  if(Array.isArray(body)) inner=body.length?`<ul class="lst">${body.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="para none">nessun dato</p>`;
  else if(body&&typeof body==="object") inner=`<dl>${Object.entries(body).map(([k,v])=>`<div class="f"><dt>${esc(k)}</dt><dd>${val(v)}</dd></div>`).join("")}</dl>`;
  else inner=`<p class="para">${val(body)}</p>`;
  return `<div class="sec"><h2>${esc(title)}</h2>${inner}</div>`;
}
function card(s){
  const meta=[s.pratica&&`Pratica ${esc(s.pratica)}`,s.aggiornamento&&`Agg. ${esc(s.aggiornamento)}`,s.fonte&&`Fonte: ${esc(s.fonte)}`].filter(Boolean);
  return `<article class="card"><div class="stamp">RISERVATO</div><div class="head"><div class="kind">${esc(s.tipo||"Scheda")}</div><h1>${esc(s.titolo)}</h1>${meta.length?`<div class="meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>`:""}</div>${s.immagine?`<img class="photo" src="${s.immagine}" alt="">`:""}${Object.entries(s.sezioni||{}).map(([k,v])=>section(k,v)).join("")}${s.note?section("Note dell'operatore",s.note):""}</article>`;
}

const $=id=>document.getElementById(id);
let hist=store.get("bd_storico")||[];
function drawHist(){
  $("hist").innerHTML=hist.length?`<h3>Ricerche recenti</h3>${hist.map((h,i)=>`<button data-h="${i}"><span>${esc(h.q)}</span><span class="${h.ok?"ok":"ko"}">${h.ok?"TROVATO":"NESSUN ESITO"}</span></button>`).join("")}`:"";
  $("hist").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{$("q").value=hist[+b.dataset.h].q;search();});
}
async function search(){
  const q=$("q").value.trim(); if(!q) return;
  if(!(window.crypto&&crypto.subtle)){$("st").textContent="";$("out").innerHTML=`<div class="miss">Questo visualizzatore non permette la ricerca.<p>Aprire il link con Chrome o Safari.</p></div>`;return}
  $("go").disabled=true; $("st").textContent="Ricerca in corso…"; $("out").innerHTML="";
  const s=await lookup(q);
  $("go").disabled=false;
  if(s){$("st").textContent="1 scheda trovata";$("out").innerHTML=card(s);}
  else{$("st").textContent="0 risultati";$("out").innerHTML=`<div class="miss">Nessuna corrispondenza per <b>«${esc(q)}»</b><p>Verificare che il dato sia completo e scritto correttamente.</p><p>Criteri di ricerca ammessi:</p><ul class="lst"><li>Persone: nome e cognome completi, targa di un veicolo intestato, numero di cellulare</li><li>Società e ditte: ragione sociale completa o parte distintiva del nome</li></ul></div>`;}
  hist=[{q,ok:!!s},...hist.filter(h=>norm(h.q)!==norm(q))].slice(0,12);
  store.set("bd_storico",hist); drawHist();
  $("q").blur(); window.scrollTo({top:0});
}
$("f").addEventListener("submit",e=>{e.preventDefault();search();});
drawHist();
if(!hist.length) $("out").innerHTML=`<p class="empty">Nessuna ricerca effettuata.</p>`;
</script>
